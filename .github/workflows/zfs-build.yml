name: ZFS Android Build
on:
  push:
    branches: [zfs-development]
    paths:
      - "zfs/**"
      - "settings.gradle.kts"
      - ".github/workflows/zfs-build.yml"
  workflow_dispatch:
concurrency:
  group: zfs-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble ZFS APK
        run: gradle --no-daemon :zfs:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-vault-android-apk
          path: zfs/build/outputs/apk/debug/zfs-debug.apk
          if-no-files-found: error
          retention-days: 14
